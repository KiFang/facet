# Facet OS — Nginx: отдаёт портал, проксирует API и админку PocketBase.

# Лимиты запросов: общий для API и строгий для входа (защита от подбора пароля).
limit_req_zone $binary_remote_addr zone=facet_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=facet_auth:10m rate=10r/m;
limit_req_status 429;

# Протокол клиента: от Caddy приходит https, без него — схема самого Nginx.
map $http_x_forwarded_proto $facet_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # За Caddy (HTTPS) настоящий IP клиента приходит в X-Forwarded-For из внутренней сети Docker.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Декларативный слепок клуба монтируется отдельно (единый источник правды).
    location = /club-schema.json {
        alias /usr/share/nginx/club-schema.json;
        include /etc/nginx/snippets/facet-headers.conf;
        include /etc/nginx/snippets/facet-csp.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Вход в PocketBase — не больше 10 попыток в минуту с одного IP.
    location ~ ^/api/collections/[^/]+/auth-with-password$ {
        limit_req zone=facet_auth burst=5 nodelay;
        include /etc/nginx/snippets/facet-proxy.conf;
        include /etc/nginx/snippets/facet-headers.conf;
    }

    # REST + realtime (SSE) API PocketBase
    location /api/ {
        limit_req zone=facet_api burst=60 nodelay;
        include /etc/nginx/snippets/facet-proxy.conf;
        include /etc/nginx/snippets/facet-headers.conf;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    # Панель управления PocketBase (своя политика скриптов — без CSP портала).
    location /_/ {
        include /etc/nginx/snippets/facet-proxy.conf;
        include /etc/nginx/snippets/facet-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/facet-headers.conf;
        include /etc/nginx/snippets/facet-csp.conf;
    }
}
