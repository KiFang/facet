# Еженедельные обновления зависимостей: npm, GitHub Actions и базовые образы Docker.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /hub
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /src/export-templates
    schedule: { interval: weekly }
